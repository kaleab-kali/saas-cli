name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: {{projectSlug}}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/{{projectSlug}}_test"
      BETTER_AUTH_SECRET: "test-auth-secret"
      BETTER_AUTH_URL: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:5173"
      VITE_API_URL: "http://localhost:3000"
      VITE_APP_NAME: "{{projectName}} Test"
      SUPER_ADMIN_EMAIL: "admin@example.com"
      SUPER_ADMIN_PASSWORD: "Password123!"
      SAMPLE_OWNER_EMAIL: "owner@example.com"
      SAMPLE_OWNER_PASSWORD: "Password123!"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Database
        run: |
          pnpm db:generate
          pnpm db:push
          pnpm db:seed
      - name: Install Playwright Browsers
        run: pnpm dlx playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
