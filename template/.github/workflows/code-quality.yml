name: Code Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Linter
        run: pnpm lint

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit
      - name: Typecheck Web
        run: pnpm --filter web exec tsc --noEmit

  unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test API
        run: pnpm test:api

  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    needs: [lint, types, unit-tests]
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: https://ci.vyllion.test
      FRONTEND_URL: https://ci.vyllion.test
      VITE_API_URL: http://localhost:3000
      VITE_APP_NAME: "{{projectName}} CI"
      DEPLOY_HOST: 127.0.0.1
      METRICS_TOKEN: ci-metrics-token
      SMTP_HOST: smtp.ci.vyllion.test
      SMTP_FROM: noreply@ci.vyllion.test
      API_RATE_LIMIT_PER_TENANT: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Setup Go for security scanners
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Install security scanners
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          python -m pipx install semgrep
          go install github.com/gitleaks/gitleaks/v8@latest
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install go.k6.io/k6@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Generate throwaway CI secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Deploy readiness gate
        run: pnpm deploy:check

