openapi: 3.0.3
info:
  title: API smoke contract
  description: Minimal local OpenAPI document used to validate the contract linting toolchain.
  version: 1.0.0
tags:
  - name: health
    description: Service health endpoints.
paths:
  /health:
    get:
      operationId: getHealth
      description: Returns the current service health state.
      tags:
        - health
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /health/live:
    get:
      operationId: getHealthLive
      description: Returns process-level liveness without dependency checks.
      tags:
        - health
      responses:
        "200":
          description: Liveness status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - uptimeSeconds
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  uptimeSeconds:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
  /health/ready:
    get:
      operationId: getHealthReady
      description: Returns readiness status for required runtime dependencies.
      tags:
        - health
      responses:
        "200":
          description: Runtime dependencies are ready.
        "503":
          description: One or more required dependencies are unavailable.
  /api/v1/health/detailed:
    get:
      operationId: getDetailedHealth
      description: Returns admin-only detailed runtime diagnostics.
      tags:
        - health
      responses:
        "200":
          description: Detailed health status for authenticated super admins.
        "401":
          description: Admin authentication is required.
        "503":
          description: A critical dependency is unavailable.
