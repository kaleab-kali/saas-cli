id: vyllion-exposed-env-files

info:
  name: Exposed environment files
  author: vyllion
  severity: high
  description: Detects accidentally served environment files.

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/apps/api/.env"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: or
        words:
          - "DATABASE_URL="
          - "BETTER_AUTH_SECRET="
          - "STRIPE_SECRET_KEY="
